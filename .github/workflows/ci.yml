name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # ------------------------------------------------------------------------
  # Fast feedback: no AWS, no emulator.
  # ------------------------------------------------------------------------
  static-checks:
    name: Lint, unit tests & security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: JavaScript syntax check
        working-directory: app
        run: npm run lint

      - name: Unit tests (Lambda)
        working-directory: app
        run: |
          npm ci
          npm test

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt

      - name: Ruff (Python tests)
        run: |
          pip install -q -r tests/requirements-dev.txt
          ruff check tests
          ruff format --check tests

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      - name: terraform validate
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

      - name: Checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@b17b606d6ec72bb8ba5721ad5b7e340b80a9fc39 # v12.3142.0
        with:
          directory: infra
          config_file: .checkov.yaml
          quiet: true

  # ------------------------------------------------------------------------
  # Real deployment + end-to-end tests against AWS Emulator.
  # Ephemeral environment: created and destroyed in every run.
  # ------------------------------------------------------------------------
  integration:
    name: Deploy & test on AWS Emulator
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start AWS Emulator
        env:
          EMULATOR_LOG: ${{ runner.temp }}/aws-emulator.log
        run: bash scripts/start-emulator.sh

      - name: Smoke test (who am I?)
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: infra
        run: terraform init

      - name: terraform plan
        working-directory: infra
        run: |
          terraform plan -out=tfplan
          {
            echo '### Terraform plan'
            echo '```'
            terraform show -no-color tfplan | tail -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply
        working-directory: infra
        run: terraform apply tfplan

      # A second plan right after apply must be empty (exit code 2 = drift).
      - name: Idempotency check
        working-directory: infra
        run: terraform plan -detailed-exitcode

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: End-to-end tests
        run: |
          pip install -q -r tests/requirements.txt
          pytest tests/integration -v

      - name: terraform destroy
        if: always()
        working-directory: infra
        run: terraform destroy -auto-approve

      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-emulator-log
          path: ${{ runner.temp }}/aws-emulator.log
          if-no-files-found: ignore
